name: TestFlight

permissions:
  contents: write
  id-token: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-beta:
    name: Deploy macOS + iOS to TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CURRENT_BRANCH: ${{ github.ref_name }}
      BWS_VERSION: "1.0.0"
      # Bundle id is com.rheosoft.oscope. The Xcode project is Oscope.xcodeproj;
      # the lanes find that project themselves and use PROJECT_NAME only for the id.
      PROJECT_NAME: oscope

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Sync to latest branch head
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

      - name: Select Xcode
        run: /usr/bin/xcodebuild -version

      - name: Prepare local bin path
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Bitwarden Secrets Manager CLI (bws)
        id: cache-bws
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.local/bin/bws
          key: bws-${{ runner.os }}-${{ runner.arch }}-${{ env.BWS_VERSION }}

      - name: Install Bitwarden Secrets Manager CLI (bws)
        if: steps.cache-bws.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o bws.zip \
            "https://github.com/bitwarden/sdk/releases/download/bws-v${{ env.BWS_VERSION }}/bws-aarch64-apple-darwin-${{ env.BWS_VERSION }}.zip"
          unzip -q bws.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/bws"

      - name: Verify bws install
        run: bws --version

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Bumps CURRENT_PROJECT_VERSION once, then archives/uploads iOS and macOS
      # with that same build number. The bump commit uses [skip ci] so it does
      # not re-trigger this workflow.
      - name: Run Fastlane ship_beta (iOS + macOS)
        run: bws run --project-id 9c8584c2-a53a-45fb-a276-b3610119586a -- bundle exec fastlane ship_beta
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gym-logs
          path: ~/Library/Logs/gym/*.log
